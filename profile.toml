# Settings for the live profile. The hourly workflow reads this file,
# pulls fresh numbers from the GitHub API and regenerates assets/ and the
# live sections of README.md.

login = "nikhilreddy00"

[identity]
name = "Nikhil Reddy"
headline = "AI Engineer"
current_role = "Data Scientist"
current_org = "Echelon Insights"

[projects]
# Pinned at the top of the README with hand-written copy; the auto list skips them.
featured = ["praxis", "AnalystAI"]
# How many of the most recently pushed public repos to list automatically.
recent_count = 5
# Repos that never appear anywhere (the profile repo itself, experiments, ...).
exclude = ["nikhilreddy00"]

[languages]
# Notebook bytes are mostly embedded outputs and plots, and HTML/CSS is mostly
# generated pages, so both would drown out real source code. Those repos
# still count toward every other metric.
exclude = ["Jupyter Notebook", "HTML", "CSS"]
top = 5

[latent_space]
