name: Profile agent

# Visitors run a command by opening an issue titled "agent: <command>".
# The agent replies, closes and locks the issue, and logs the run in README.md.
#
# Security model (anyone on GitHub can trigger this):
# - Runs the code on the default branch only; nothing from the issue is executed.
# - The title reaches the script as an environment variable, never as shell
#   or expression text, and is parsed against an allowlist.
# - The token can touch this repository only: comment/close/lock issues and
#   commit README.md. It cannot delete or create repos, and no other secret
#   is available to this workflow.
on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: profile-agent-${{ github.event.issue.number }}

jobs:
  respond:
    if: contains(github.event.issue.title, 'agent:') || contains(github.event.issue.title, 'Agent:') || contains(github.event.issue.title, 'AGENT:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Answer the command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as data via env, never interpolated into the script.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: python scripts/agent.py respond

      - name: Save the session log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Log profile agent run"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            if git pull --rebase "$remote" main && git push "$remote" HEAD:main; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
