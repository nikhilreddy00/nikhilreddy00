name: Live profile

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.toml"
      - "README.md"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch GitHub data and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a read-only token of yours that can see private repos adds their languages.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/build_profile.py

      - name: Commit if anything changed
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live profile"
          git pull --rebase origin main
          git push origin HEAD:main
