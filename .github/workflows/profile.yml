name: Live profile

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.toml"
      - "README.md"
      - "site/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch GitHub data and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a read-only token of yours that can see private repos adds their languages.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/build_profile.py

      - name: Refresh the agent session log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/agent.py sessions

      - name: Commit if anything changed
        id: commit
        run: |
          git add assets README.md site/data.json
          if git diff --cached --quiet; then
            echo "Profile already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live profile"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Publish site/ (the interactive version) to GitHub Pages whenever the data
  # changed, and on every push or manual run so site code changes go out too.
  deploy:
    needs: render
    if: needs.render.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live site responds
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ steps.deployment.outputs.page_url }}data.json" -o /dev/null \
               && curl -fsS "${{ steps.deployment.outputs.page_url }}" | grep -q "Agent OS"; then
              echo "Live at ${{ steps.deployment.outputs.page_url }}"; exit 0
            fi
            sleep 10
          done
          echo "Site did not respond after deploy"; exit 1
